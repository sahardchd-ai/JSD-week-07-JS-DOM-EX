<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raise your tree</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <header>
      <a href="index.html">
        <img
          src="media/clicktreeicon-removebg-preview2.png"
          alt="Sapling Logo"
          class="leaves-icon"
        />
      </a>
      <div id="headTitle">
        <h1>Raise your tree</h1>
        <p>Water your plants to help them grow.</p>
      </div>
      <div class="stats-btn" type="button">
        <span class="material-symbols-outlined" id="statIcon">bar_chart</span>
        <span class="btn-label">STATS</span>
      </div>
    </header>

    <div id="field">
      <!-- section left -->
      <section id="sectionLeft">
        <div id="scoreText">
          <div>Score</div>
          <div id="scoreCount"></div>
        </div>
        <div id="tree-hint">TAP TO WATERING</div>
        <button id="btn-watering"></button>
        <button id="btn-reset">Don't click it</button>
      </section>

      <div id="seperator"></div>
      <!--เส้นแบ่งsection-->

      <!-- section right -->
      <section id="sectionRight">
        <div>
          <h2>Store</h2>
          <p>use your to upgrade your skill issue</p>
        </div>
        <div id="upgradeStore">
          <div id="upgrade1" class="canBuy">
            <p class="upgrade-title">Add Fertilizer</p>

            <p class="upgrade-cost">15 scores</p>

            <p id="fertilizerCount1" class="upgrade-count">0</p>
          </div>
          <div id="upgrade2" class="canBuy">
            <p class="upgrade-title">Add Fertilizer</p>

            <p class="upgrade-cost">15 scores</p>

            <p id="fertilizerCount2" class="upgrade-count">0</p>
          </div>
          <div></div>
        </div>
      </section>

      <!-- <div id="seperator"></div>เส้นแบ่งsection -->
    </div>
  </body>
  <script src="script.js"></script>
</html>
