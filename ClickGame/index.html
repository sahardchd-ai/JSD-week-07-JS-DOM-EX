<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raise your tree</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    />

  <body>
    <header>
      <h1 style="text-align: center">Raise your tree</h1>
      <p style="text-align: center">Water your plants to help them grow.</p>
    </header>

    <div id="field">
      <!-- section left -->
      <section id="sectionLeft">
        <div id="scoreText">
          <div>Score</div>
          <div id="scoreCount">
            <img
              alt="Sapling Logo"
              class="leaves-icon"
              src="media/clicktreeicon.jpg"
            />
          </div>
        </div>
        <div id="tree-hint">TAP TO WATERING</div>
        <button id="btn-watering"></button>
      </section>

      <div id="seperator"></div>
      <!--เส้นแบ่งsection-->

      <!-- section left -->
      <section id="sectionRight">Your stat and store</section>

      <!-- <div id="seperator"></div>เส้นแบ่งsection -->
    </div>
  </body>
  <script src="script.js"></script>
